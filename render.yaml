# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via: https://dashboard.render.com/blueprints
#
# FREE TIER NOTES:
# - Instance sleeps after 15 min inactivity (cold start ~30s)
# - DB connection may drop after sleep — consider a keep-alive or restart logic
# - No persistent disk; /tmp only, 512 MB RAM, 0.5 CPU
#
# Setup:
#   1. Connect this repo in Render Dashboard → Blueprints
#   2. Set secret env vars (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, etc.) — do NOT commit real values
#   3. Deploy

services:
  - type: web
    name: tandem-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: PORT
        value: "8000"
